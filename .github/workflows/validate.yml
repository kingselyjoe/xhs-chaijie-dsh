name: Validate Skill

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build fictional demo
        run: python scripts/build_demo.py
      - name: Validate DSH bundle
        run: python scripts/validate_skill.py
      - name: Validate report links and assets
        run: python scripts/validate_report_links.py examples/sample_report.html
